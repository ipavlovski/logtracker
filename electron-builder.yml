# Desktop installer (pnpm dist:win, or the release workflow on a v* tag). See electron/main.ts.
appId: com.logtracker.app
productName: Logtracker
copyright: Copyright © 2026 IP

directories:
  output: release
  buildResources: build

# The main process bundle (scripts/build-electron.ts); package.json "dependencies" come along as node_modules.
files:
  - dist-electron/**
  - "!dist-electron/**/*.map"
  - package.json
extraResources:
  - from: dist
    to: dist
  - from: server/db/migrations
    to: migrations
  # The tray icon (electron/tray.ts).
  - from: build/tray.png
    to: tray.png
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
# better-sqlite3 ships Node-API prebuilds for every platform, which load in Electron as they are.
npmRebuild: false

win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Logtracker-Setup-${version}.${ext}

# Auto-update source: electron-updater reads latest.yml from this public repo's GitHub Releases.
publish:
  provider: github
  owner: ipavlovski
  repo: logtracker
  releaseType: release
